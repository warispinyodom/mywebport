{% extends 'base.html' %}
{% block title %}เข้าสู่ระบบ Admin Security Portal{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[75vh] px-4">
    <div class="bg-slate-800/90 p-6 md:p-8 rounded-2xl border border-slate-700/80 max-w-md w-full shadow-2xl backdrop-blur-md">
        <div class="text-center mb-6">
            <div class="w-16 h-16 bg-indigo-600/20 rounded-full flex items-center justify-center mx-auto mb-3 border border-indigo-500/40">
                <i class="fas fa-shield-halved text-3xl text-indigo-400"></i>
            </div>
            <h2 class="text-2xl font-bold text-white tracking-tight">Admin Portal Login</h2>
            <p class="text-slate-400 text-xs mt-1">ส่วนเฉพาะผู้ดูแลระบบเท่านั้น (Protected by OWASP Security)</p>
        </div>

        <form action="/login" method="POST" class="space-y-4">
            <!-- OWASP Anti-CSRF Token -->
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div>
                <label class="block text-xs font-semibold mb-1.5 text-slate-300">Username</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-500">
                        <i class="fas fa-user text-sm"></i>
                    </span>
                    <input type="text" name="username" required autocomplete="off" class="w-full bg-slate-900 border border-slate-700 rounded-xl pl-9 pr-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold mb-1.5 text-slate-300">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-500">
                        <i class="fas fa-key text-sm"></i>
                    </span>
                    <input type="password" name="password" required autocomplete="current-password" class="w-full bg-slate-900 border border-slate-700 rounded-xl pl-9 pr-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition">
                </div>
            </div>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl transition shadow-lg shadow-indigo-600/30 text-sm mt-2">
                <i class="fas fa-lock mr-2"></i> เข้าสู่ระบบอย่างปลอดภัย
            </button>
        </form>
    </div>
</div>
{% endblock %}
