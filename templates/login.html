{% extends 'base.html' %}
{% block title %}เข้าสู่ระบบ Admin{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[70vh] px-4">
    <div class="bg-slate-800 p-8 rounded-xl border border-slate-700 max-w-md w-full shadow-2xl">
        <div class="text-center mb-6">
            <i class="fas fa-user-shield text-4xl text-indigo-400 mb-2"></i>
            <h2 class="text-2xl font-bold">Admin Portal Login</h2>
            <p class="text-slate-400 text-sm">ส่วนเฉพาะผู้ดูแลระบบเท่านั้น</p>
        </div>

        <form action="/login" method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1 text-slate-300">Username</label>
                <input type="text" name="username" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1 text-slate-300">Password</label>
                <input type="password" name="password" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-indigo-500">
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-lg transition">
                เข้าสู่ระบบ
            </button>
        </form>
    </div>
</div>
{% endblock %}
